name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements*.txt'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable executable
        run: python tools/build_windows.py
      - name: Run application tests
        run: .\.build-venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Smoke check frozen executable
        shell: pwsh
        run: |
          $result = Join-Path $PWD 'frozen-check.json'
          $process = Start-Process -FilePath '.\dist\InvoiceManager.exe' -ArgumentList @('--self-check', 'frozen-check.json') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE check exited with $($process.ExitCode)" }
          if (!(Test-Path $result)) { throw 'EXE did not produce a check result' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if ($check.status -ne 'passed') { throw 'EXE self check failed' }
          $expected = Join-Path $PWD 'dist\data'
          if ($check.data_directory -ne $expected) { throw 'Mutable data path must be next to the executable' }
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceManager-Windows-x64
          path: dist/InvoiceManager.exe
          if-no-files-found: error
